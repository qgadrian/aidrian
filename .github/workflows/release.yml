name: Release

# A release is a version change on main: hosts install the plugin from main and cache it by version.
# After each merge, scripts/version.mjs release raises the version for the plugin commits since the latest v* tag,
# at the level their subjects call for, and this job commits, tags, and pushes it, then publishes the release notes.
# Run it by hand to force a level, such as major for 1.0.0.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      level:
        description: Release level; auto reads the commit subjects since the last tag
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: auto

permissions:
  contents: read

# One release at a time, and none cancelled halfway: each run releases everything on main since the last tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    # The release commit itself releases nothing. A push made with GITHUB_TOKEN starts no workflow anyway.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release)') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The newest main, not the pushed commit: a run that waited in the queue releases what merged meanwhile.
          ref: main
          # The tags and the history to them: the release counts the plugin commits since the latest v* tag.
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Raise the version
        id: version
        env:
          LEVEL: ${{ inputs.level }}
        run: |
          args=()
          if [ -n "$LEVEL" ] && [ "$LEVEL" != auto ]; then args=(--level "$LEVEL"); fi
          node scripts/version.mjs release "${args[@]}" | tee release.out
          last=$(tail -n 1 release.out)
          rm release.out
          case "$last" in version=*) echo "$last" >> "$GITHUB_OUTPUT" ;; esac

      - name: Check the release
        if: steps.version.outputs.version != ''
        run: npm run check

      - name: Commit, tag, and push
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -am "chore(release): aidrian v$VERSION"
          git tag -a "v$VERSION" -m "aidrian v$VERSION"
          # Both or neither: a tag without its commit on main, or the reverse, would break the next release.
          git push --atomic origin HEAD:main "v$VERSION"

      - name: Publish the release notes
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$VERSION" --title "aidrian v$VERSION" --generate-notes --verify-tag
