name: Pilot candidate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.agent-harness/overlays/**'
      - '.agents/skills/**'
      - '.claude/agents/**'
      - '.codex/agents/**'
      - '.codex/config.toml'
      - 'catalog/**'
      - 'docs/**'
      - 'provenance/distribution-files.json'
      - 'src/**'
      - 'test/pilot/**'

permissions:
  contents: read

jobs:
  provider-free-candidate:
    name: Provider-free candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out producer source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Check JavaScript and neutral generated catalog
        run: npm run check:javascript-syntax && npm run check:generated

      - name: Verify producer projection and neutral consumers
        run: node --test test/pilot/producer-self-dogfood.test.mjs test/pilot/lifecycle-fixture.test.mjs test/pilot/cross-project-isolation.test.mjs test/pilot/provider-claims.test.mjs

      - name: Build and scan private pilot artifact
        run: npm run build:pilot && npm run check:distribution-artifact -- --artifact dist/pilot/private-pilot.tgz
